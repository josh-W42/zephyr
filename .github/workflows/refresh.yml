name: refresh-data
# ~4.5 h after each GFS cycle (00/06/12/18z), when its early forecast hours are published.
on:
  schedule:
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Firebase Hosting
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - run: python -m pytest pipeline -q
      - name: Build textures from the latest GFS run
        run: python -m zephyr_pipeline --out web/public/data
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Deploy
        if: github.event_name == 'schedule' || inputs.deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
